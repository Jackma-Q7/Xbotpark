<text x="24" y="320" fill="#555" font-size="15">紫色：主机发送/控制 SDA　　青色：IMU 发送数据　　绿色：IMU 返回 ACK　　红色区域：主机释放 SDA，发送 NACK</text>
<text x="24" y="350" fill="#555" font-size="15">Sr = 重复起始：保持总线占用，从写寄存器地址切换到读数据；最后一个字节后 NACK，再 STOP。</text>
<text x="24" y="378" fill="#666" font-size="14">除 START / Sr / STOP 外，SDA 在 SCL 高电平期间保持稳定。高电平由释放开漏总线后的上拉产生；图中省略模拟上升时间。</text>
