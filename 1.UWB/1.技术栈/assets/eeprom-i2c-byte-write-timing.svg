<text x="24" y="320" fill="#555" font-size="15">紫色：STM32 发送地址/数据、控制 START / STOP　　绿色：EEPROM 拉低 SDA，返回 ACK</text>
<text x="24" y="350" fill="#555" font-size="15">三个字节均由主机发送，每字节后由 EEPROM 应答；收到最后一个 ACK 后，主机产生 STOP。</text>
<text x="24" y="380" fill="#666" font-size="14">STOP 后 EEPROM 执行内部写入；ACK 表示接收字节，不代表已完成掉电保存。时间轴未按比例绘制。</text>
</g></svg>
